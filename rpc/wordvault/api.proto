syntax = "proto3";
package wordvault;

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "rpc/wordsearcher/searcher.proto";

enum Score {
  SCORE_NONE = 0;
  SCORE_AGAIN = 1;
  SCORE_HARD = 2;
  SCORE_GOOD = 3;
  SCORE_EASY = 4;
}

message Card {
  string lexicon = 1;
  wordsearcher.Alphagram alphagram = 2;
  bytes card_json_repr = 3;
  // The retrievability of a card is not part of the json repr and is computed
  // as of the time of request.
  double retrievability = 4;
  bytes review_log = 5;
  uint64 deck_id = 6;
}

message CardPreview {
    string lexicon = 1;
    string alphagram = 2;
    uint64 deck_id = 5;
}

message GetCardInfoRequest {
  string lexicon = 1;
  repeated string alphagrams = 2;
}

message GetNextScheduledRequest {
  string lexicon = 1;
  uint32 limit = 2;
  uint64 deck_id = 3;
}

message GetSingleNextScheduledRequest {
  string lexicon = 1;
  uint64 deck_id = 2;
}

message GetSingleNextScheduledResponse {
  Card card = 1;
  uint32 overdue_count = 2;
}

message Cards { repeated Card cards = 1; }

message ScoreCardRequest {
  Score score = 1;
  string lexicon = 2;
  string alphagram = 3;
}

message ScoreCardResponse {
  google.protobuf.Timestamp next_scheduled = 1;
  bytes card_json_repr = 2;
  // How many times the card has been rated AGAIN, including this score. The
  // FSRS card's Lapses only counts misses of cards in the Review state.
  uint32 times_missed = 3;
}

// ScoreCardsRequest gives the same score to several cards at once, e.g. to
// mark every card missed in a Wordwalls round as AGAIN.
message ScoreCardsRequest {
  Score score = 1;
  string lexicon = 2;
  repeated string alphagrams = 3;
}

message ScoreCardsResponse {
  uint32 num_scored = 1;
  // Requested alphagrams that were not scored, either because there is no
  // such card or because the card was just reviewed.
  repeated string not_scored = 2;
}

// BatchScoreCardsRequest scores several cards at once, each with its own
// score, e.g. the ratings from a Wordwalls round of due cards.
message BatchScoreCardsRequest {
  string lexicon = 1;
  repeated CardScore scores = 2;
}

message CardScore {
  string alphagram = 1;
  Score score = 2;
}

message ScoredCard {
  // The alphagram as given in the request.
  string alphagram = 1;
  google.protobuf.Timestamp next_scheduled = 2;
}

message BatchScoreCardsResponse {
  repeated ScoredCard scored = 1;
  // Requested alphagrams that were not scored, either because there is no
  // such card or because the card was just reviewed.
  repeated string not_scored = 2;
}

message AddCardsRequest {
  string lexicon = 1;
  // Exactly one of alphagrams or search_params must be given. If
  // search_params is given, the server runs the search in the request's
  // lexicon and adds the resulting alphagrams. Any lexicon condition in
  // search_params is ignored.
  repeated string alphagrams = 2;
  uint64 deck_id = 3;
  repeated wordsearcher.SearchRequest.SearchParam search_params = 4;
}

message AddCardsResponse {
    uint32 num_cards_added = 1;
    uint32 num_cards_in_other_decks = 2;
    repeated CardPreview cards_in_other_decks_preview = 3;
}

message MoveCardsRequest {
  string lexicon = 1;
  // Exactly one of alphagrams or search_params must be given (see
  // AddCardsRequest).
  repeated string alphagrams = 2;
  uint64 target_deck_id = 3;
  // The following two fields are mutually exclusive.
  bool from_all_decks = 4;
  uint64 source_deck_id = 5;
  repeated wordsearcher.SearchRequest.SearchParam search_params = 6;
}

message MoveCardsResponse {
  uint32 num_cards_moved = 1;
}

message EditLastScoreRequest {
  string lexicon = 1;
  string alphagram = 2;
  Score new_score = 3;
  bytes last_card_repr = 4;
}

message GetCardCountRequest {}

message CardCountResponse {
  map<string, uint32> num_cards = 1;
  uint32 total_cards = 2;
}

message GetCardCountByDeckRequest { string lexicon = 1; }

message DeckCardCount {
  uint64 deck_id = 1; // 0 represents the default deck
  uint32 count = 2;
}

message GetCardCountByDeckResponse { repeated DeckCardCount items = 1; }

message NextScheduledCountRequest {
  bool only_overdue = 1;
  string timezone = 2;
  string lexicon = 3;
}

message NextScheduledBreakdown { map<string, uint32> breakdown = 1; }

message NextScheduledCountByDeckRequest {
  bool only_overdue = 1;
  string timezone = 2;
  string lexicon = 3;
}

message DeckBreakdown {
  uint64 deck_id = 1;
  map<string, uint32> breakdown = 2;
}

message NextScheduledCountByDeckResponse {
  repeated DeckBreakdown breakdowns = 1;
}

// TODO: make this deck-aware with a mutually exclusive all_decks/deck_id
// parameter
message PostponeRequest {
  string lexicon = 1;
  uint32 num_to_postpone = 2;
}

message PostponeResponse { uint32 num_postponed = 1; }

message DeleteRequest {
  string lexicon = 1;
  // The following four conditions are mutually exclusive.
  bool only_new_questions = 2;
  repeated string only_alphagrams = 3;
  bool all_questions = 4;
  // Delete the cards matching this search (see AddCardsRequest).
  repeated wordsearcher.SearchRequest.SearchParam search_params = 5;
}

message DeleteResponse { uint32 num_deleted = 1; }

// Needs to be a separate request from the non-deck-aware delete request because
// we need to be able to differentiate between no deck ID meaning default deck
// vs. no deck ID meaning all decks
message DeleteFromDeckRequest {
  string lexicon = 1;

  // The following four conditions are mutually exclusive.
  bool only_new_questions = 2;
  repeated string only_alphagrams = 3;
  bool all_questions = 4;
  // Delete the cards matching this search (see AddCardsRequest).
  repeated wordsearcher.SearchRequest.SearchParam search_params = 6;

  uint64 deck_id = 5;
}

message GetDailyProgressRequest { string timezone = 1; }

message GetDailyProgressResponse { map<string, int32> progress_stats = 1; }

message GetDailyProgressByDeckRequest { string timezone = 1; }

message DailyProgressByDeckItem {
  // Nullable deck id. Null represents the default deck.
  google.protobuf.Int64Value deck_id = 1;
  map<string, int32> progress_stats = 2;
}

message GetDailyProgressByDeckResponse {
  repeated DailyProgressByDeckItem items = 1;
}

// Leaderboard days are America/Los_Angeles days, whatever the timezone.
message GetDailyLeaderboardRequest {
  string timezone = 1 [deprecated = true];
}

message GetDailyLeaderboardResponse {
  message LeaderboardItem {
    string user = 1;
    int32 cards_studied = 2;
  }
  repeated LeaderboardItem items = 1;
}

message GetWeeklyLeaderboardRequest {}

message GetWeeklyLeaderboardResponse {
  message LeaderboardItem {
    string user = 1;
    // Cards studied on each of the days, in the same order.
    repeated int32 cards_studied_by_day = 2;
    // Cards studied over the week.
    int32 cards_studied = 3;
  }
  // The last seven leaderboard (America/Los_Angeles) days as YYYY-MM-DD,
  // oldest first. The last one is today.
  repeated string days = 1;
  // Most cards studied over the week first.
  repeated LeaderboardItem items = 2;
}

enum FsrsScheduler {
    FSRS_SCHEDULER_NONE = 0;
    FSRS_SCHEDULER_LONG_TERM = 1;
    FSRS_SCHEDULER_SHORT_TERM = 2;
}

message FsrsParameters {
    FsrsScheduler scheduler = 1;
    double request_retention = 2;
}

message GetFsrsParametersRequest {}

message GetFsrsParametersResponse {
    FsrsParameters parameters = 1;
    // The FSRS version the user's cards are scheduled with (5 or 6). Users on
    // version 5 can upgrade with UpgradeFsrs.
    int32 fsrs_version = 2;
}

message PreviewFsrsUpgradeRequest {}

message UpgradeFsrsRequest {}

// What upgrading to FSRS-6 does (or did) to a user's cards. The upgrade
// replays each reviewed card's history to rebuild its memory state (stability
// and difficulty) under FSRS-6, but keeps its due date, so no cards become due
// because of it. The new memory state shows up in the intervals cards get
// from their next review on. "Due" counts are relative to the time of the
// request.
message FsrsUpgradeSummary {
    int32 current_version = 1;
    int32 target_version = 2;
    uint32 total_cards = 3;
    // Cards whose memory state was rebuilt by replaying their review history.
    uint32 rescheduled_cards = 4;
    // Cards imported from Cardbox, which have no real history before the
    // import. They're left alone.
    uint32 imported_cards = 5;
    // New (never reviewed) cards, and any whose history couldn't be replayed.
    // They're left alone.
    uint32 unchanged_cards = 6;
    // Due dates don't change, so the before and after counts are the same.
    uint32 due_now_before = 7;
    uint32 due_now_after = 8;
    uint32 due_within_week_before = 9;
    uint32 due_within_week_after = 10;
    uint32 due_within_month_before = 11;
    uint32 due_within_month_after = 12;
    // Always 0: due dates don't move.
    uint32 moved_earlier = 13;
    uint32 moved_later = 14;
    // Median of (due date - last review) in days, over reviewed cards. The
    // same before and after.
    double median_interval_days_before = 15;
    double median_interval_days_after = 16;
    // How intervals drift. For each rebuilt card in review, the interval it
    // would get if answered Good when it next comes up (at its due date, or
    // now if it's overdue), with its current memory state and version, and
    // with its rebuilt one and the target version.
    uint32 good_interval_shorter = 17;
    uint32 good_interval_longer = 18;
    double median_good_interval_days_before = 19;
    double median_good_interval_days_after = 20;
}

message PreviewFsrsUpgradeResponse {
    FsrsUpgradeSummary summary = 1;
}

message UpgradeFsrsResponse {
    FsrsUpgradeSummary summary = 1;
}

message EditFsrsParametersRequest {
    FsrsParameters parameters = 1;
}

message EditFsrsParametersResponse {}

message Deck {
  int64 id = 1;
  string lexicon = 2;
  string name = 3;
  // Nil if the deck is using global settings.
  FsrsParameters fsrs_parameters_override = 4;
}

message AddDeckRequest {
  string name = 1;
  string lexicon = 2;
}

message AddDeckResponse {
    Deck deck = 1;
}

message GetDecksRequest {}

message GetDecksResponse {
  repeated Deck decks = 1;
}

message EditDeckRequest {
  int64 id = 1;
  string name = 2;
  // Nil means clear the FSRS parameters (use global settings).
  FsrsParameters fsrs_parameters_override = 3;
}

message EditDeckResponse {
  Deck deck = 1;
}

message DeleteDeckRequest {
  int64 id = 1;
}

message DeleteDeckResponse {}

// The value a study plan stage is ordered and batched by. Each alphagram's
// value is its rank within its length, so 7s and 8s interleave.
enum StudyPlanSortField {
  STUDY_PLAN_SORT_PROBABILITY = 0;
  // Playability rank from HastyBot self-play (1 = most playable). Only
  // lexica with playability data (NWL23 for now) can use it.
  STUDY_PLAN_SORT_PLAYABILITY = 1;
}

enum StudyPlanBatchUnit {
  STUDY_PLAN_BATCH_NONE = 0;
  // Every missing card of one stage within one window of the sort field,
  // e.g. probability 3,501–4,000 or playability 1–500. Windows are aligned to multiples of
  // batch_size.
  STUDY_PLAN_BATCH_WINDOW = 1;
  // The next batch_size missing cards in plan order, across stages.
  STUDY_PLAN_BATCH_CARDS = 2;
}

message StudyPlanStage {
  // Optional.
  string name = 1;
  // As in AddCardsRequest.search_params. A probability range caps the stage;
  // a probability limit or list picks its alphagrams. Lists and limits must
  // come last, and the server moves them there.
  repeated wordsearcher.SearchRequest.SearchParam search_params = 2;
  StudyPlanSortField sort_field = 3;
  bool descending = 4;
}

// A study plan is an ordered list of stages that cards are added from, a
// batch at a time, into one deck. An alphagram belongs to the first stage
// whose search matches it. Progress isn't stored: a card in the user's vault
// counts as done, whichever deck it's in.
message StudyPlan {
  int64 id = 1;
  string lexicon = 2;
  string name = 3;
  // The deck batches are added to; 0 is the default deck. Several plans can
  // add to the same deck.
  uint64 deck_id = 4;
  repeated StudyPlanStage stages = 5;
  StudyPlanBatchUnit batch_unit = 6;
  uint32 batch_size = 7;
}

message AddStudyPlanRequest { StudyPlan plan = 1; }

message AddStudyPlanResponse { StudyPlan plan = 1; }

message GetStudyPlansRequest {}

message GetStudyPlansResponse { repeated StudyPlan plans = 1; }

// Replaces the plan with the given id. Its lexicon can't change.
message EditStudyPlanRequest { StudyPlan plan = 1; }

message EditStudyPlanResponse { StudyPlan plan = 1; }

// Deletes the plan only; its deck and cards stay.
message DeleteStudyPlanRequest { int64 id = 1; }

message DeleteStudyPlanResponse {}

message GetStudyPlanProgressRequest {
  oneof which {
    int64 plan_id = 1;
    // An unsaved plan, e.g. while it's being edited. Name and id are
    // ignored.
    StudyPlan plan = 2;
  }
  // Width of the progress blocks, in sort field values. Defaults to the
  // window size for window plans, and to 500 otherwise.
  uint32 block_size = 3;
  // Also count the cards in the plan's deck. This is slower: it has to read
  // every card in the lexicon rather than an index.
  bool include_deck_counts = 4;
}

message StudyPlanBlock {
  // The range of sort field values this block covers.
  int32 lo = 1;
  int32 hi = 2;
  uint32 total = 3;
  uint32 added = 4;
}

message StudyPlanStageProgress {
  uint32 total = 1;
  uint32 added = 2;
  // Whether every card from the start of the stage (in its order) up to and
  // including this sort field value is in the vault. Unset if the first card
  // isn't.
  optional int32 done_through = 3;
  // Blocks with at least one alphagram, in ascending sort field order
  // regardless of the stage's order.
  repeated StudyPlanBlock blocks = 4;
}

message StudyPlanBatchItem {
  string alphagram = 1;
  uint32 stage = 2;
  int32 length = 3;
  int32 sort_value = 4;
}

message StudyPlanBatch {
  // Index of the stage the batch starts in.
  uint32 stage = 1;
  // Window plans only: the window this batch comes from. Unset when gaps is
  // set.
  int32 window_lo = 2;
  int32 window_hi = 3;
  // In plan order. At most the server's per-request card limit; for a
  // window plan the rest of the window (or of the gaps) comes in the next
  // batch.
  repeated StudyPlanBatchItem items = 4;
  // Window plans only: every missing card in the window, or every gap when
  // gaps is set, which can be more than len(items).
  uint32 num_missing_in_window = 5;
  // Window plans only: the batch fills in gaps rather than a window. A gap
  // is a missing card that comes before the last window of its stage that's
  // complete, such as a word a new lexicon added to a finished range. The
  // batch has every gap, across windows and stages, up to the first window
  // not yet reached.
  bool gaps = 6;
}

message StudyPlanDeckCounts {
  uint32 cards_in_deck = 1;
  // Cards in the deck that belong to some stage of the plan.
  uint32 cards_in_deck_in_plan = 2;
}

message GetStudyPlanProgressResponse {
  repeated StudyPlanStageProgress stages = 1;
  uint32 total = 2;
  uint32 added = 3;
  // Unset when the plan is complete.
  StudyPlanBatch next_batch = 4;
  uint32 block_size = 5;
  // Only if include_deck_counts was set.
  StudyPlanDeckCounts deck_counts = 6;
}

message AddStudyPlanBatchRequest { int64 plan_id = 1; }

message AddStudyPlanBatchResponse {
  uint32 num_cards_added = 1;
  // What was added. Unset when the plan was already complete.
  StudyPlanBatch batch = 2;
}

service WordVaultService {
  rpc GetCardCount(GetCardCountRequest) returns (CardCountResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetCardCountByDeck(GetCardCountByDeckRequest) returns (GetCardCountByDeckResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetCardInformation(GetCardInfoRequest) returns (Cards) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetNextScheduled(GetNextScheduledRequest) returns (Cards) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetSingleNextScheduled(GetSingleNextScheduledRequest)
      returns (GetSingleNextScheduledResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc NextScheduledCount(NextScheduledCountRequest)
      returns (NextScheduledBreakdown);
  rpc NextScheduledCountByDeck(NextScheduledCountByDeckRequest)
      returns (NextScheduledCountByDeckResponse);
  rpc ScoreCard(ScoreCardRequest) returns (ScoreCardResponse);
  rpc ScoreCards(ScoreCardsRequest) returns (ScoreCardsResponse);
  rpc BatchScoreCards(BatchScoreCardsRequest) returns (BatchScoreCardsResponse);
  rpc EditLastScore(EditLastScoreRequest) returns (ScoreCardResponse);
  rpc AddCards(AddCardsRequest) returns (AddCardsResponse);
  rpc MoveCards(MoveCardsRequest) returns (MoveCardsResponse);
  rpc Postpone(PostponeRequest) returns (PostponeResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc DeleteFromDeck(DeleteFromDeckRequest) returns (DeleteResponse);
  rpc GetDailyProgress(GetDailyProgressRequest)
      returns (GetDailyProgressResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  rpc GetDailyProgressByDeck(GetDailyProgressByDeckRequest)
      returns (GetDailyProgressByDeckResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  rpc GetDailyLeaderboard(GetDailyLeaderboardRequest)
      returns (GetDailyLeaderboardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  rpc GetWeeklyLeaderboard(GetWeeklyLeaderboardRequest)
      returns (GetWeeklyLeaderboardResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  rpc GetFsrsParameters(GetFsrsParametersRequest)
      returns (GetFsrsParametersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  rpc EditFsrsParameters(EditFsrsParametersRequest) returns (EditFsrsParametersResponse);
  // Shows what UpgradeFsrs would do, without changing anything.
  rpc PreviewFsrsUpgrade(PreviewFsrsUpgradeRequest)
      returns (PreviewFsrsUpgradeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  // Moves the user from FSRS-5 to FSRS-6 weights and reschedules all their
  // cards as if they had always been on FSRS-6.
  rpc UpgradeFsrs(UpgradeFsrsRequest) returns (UpgradeFsrsResponse);
  rpc AddDeck(AddDeckRequest) returns (AddDeckResponse);
  rpc GetDecks(GetDecksRequest) returns (GetDecksResponse);
  rpc EditDeck(EditDeckRequest) returns (EditDeckResponse);
  rpc DeleteDeck(DeleteDeckRequest) returns (DeleteDeckResponse);
  rpc AddStudyPlan(AddStudyPlanRequest) returns (AddStudyPlanResponse);
  rpc GetStudyPlans(GetStudyPlansRequest) returns (GetStudyPlansResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  rpc EditStudyPlan(EditStudyPlanRequest) returns (EditStudyPlanResponse);
  rpc DeleteStudyPlan(DeleteStudyPlanRequest) returns (DeleteStudyPlanResponse);
  rpc GetStudyPlanProgress(GetStudyPlanProgressRequest)
      returns (GetStudyPlanProgressResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  };
  // Adds the plan's next batch of missing cards to its deck.
  rpc AddStudyPlanBatch(AddStudyPlanBatchRequest) returns (AddStudyPlanBatchResponse);
}
